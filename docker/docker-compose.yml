services:
  # BotrixAI app
  app:
    image: botrixai/botrixai:latest
    container_name: botrixai_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - botrixai
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads:rw
      - ./config.toml:/app/config.toml:ro
    command: ["server", "-migrate", "-config", "/app/config.toml"]

  # PostgreSQL database
  db:
    image: postgres:17-alpine
    container_name: botrixai_db
    restart: unless-stopped
    networks:
      - botrixai
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-botrixai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-botrixai}
      POSTGRES_DB: ${POSTGRES_DB:-botrixai}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-botrixai} -d ${POSTGRES_DB:-botrixai}"]
      interval: 10s
      timeout: 5s
      retries: 6
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Redis
  redis:
    image: redis:7-alpine
    container_name: botrixai_redis
    restart: unless-stopped
    networks:
      - botrixai
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data

networks:
  botrixai:

volumes:
  postgres-data:
  redis-data:
